<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="1" stop-color="#0b2a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- simple train icon -->
  <g transform="translate(120,190)" fill="none" stroke="#e8f0ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="0" y="0" width="260" height="200" rx="22"/>
    <path d="M40 200v40m180-40v40"/>
    <circle cx="70" cy="250" r="22" fill="#e8f0ff" stroke="none"/>
    <circle cx="190" cy="250" r="22" fill="#e8f0ff" stroke="none"/>
    <path d="M60 50h140"/>
    <path d="M55 95h65m30 0h65"/>
  </g>

  <!-- chat bubbles -->
  <g opacity="0.55" fill="#e8f0ff">
    <path d="M520 210c0-33 27-60 60-60h390c33 0 60 27 60 60v120c0 33-27 60-60 60H720l-70 55v-55H580c-33 0-60-27-60-60z"/>
  </g>
  <g opacity="0.25" fill="#06121f">
    <rect x="565" y="195" width="430" height="190" rx="40"/>
  </g>

  <text x="120" y="120" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
        font-size="64" font-weight="800" fill="#ffffff">電車男</text>
  <text x="120" y="165" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
