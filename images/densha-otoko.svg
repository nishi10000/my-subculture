  <text x="120" y="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
        font-size="22" fill="#b8c7d9" opacity="0.9">※イメージ画像（権利的に安全な自作）</text>
