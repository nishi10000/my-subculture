<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b0b24"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- simple "school PC" window motif -->
  <g opacity="0.28" fill="#ffffff">
    <rect x="120" y="110" width="960" height="420" rx="24"/>
  </g>
  <g opacity="0.25" fill="#0b1020">
    <rect x="150" y="150" width="900" height="340" rx="18"/>
  </g>

  <!-- lightning bolt icon (generic, not a Flash logo) -->
  <path d="M690 170 L520 355 H655 L520 525 L760 325 H620 Z" fill="url(#bolt)"/>

  <!-- title -->
  <text x="160" y="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
        font-size="54" font-weight="700" fill="#ffffff">フラッシュ保存庫</text>
  <text x="160" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
        font-size="28" fill="#d7dbe7">学校のPC／動画／ゲーム／あの頃のネット</text>

  <!-- small caption -->
  <text x="160" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif"
        font-size="22" fill="#b8bdd0" opacity="0.9">※イメージ画像（権利的に安全な自作）</text>
</svg>
