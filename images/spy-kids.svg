<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="スパイキッズ placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="1" stop-color="#0d3b66"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 48H48M48 0V48" stroke="#ffffff12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.7"/>

  <!-- gadget silhouettes (abstract) -->
  <rect x="840" y="150" width="260" height="170" rx="26" fill="#ffffff12" stroke="#ffffff22"/>
  <circle cx="920" cy="235" r="42" fill="#ffffff18"/>
  <rect x="110" y="420" width="360" height="110" rx="22" fill="#ffffff10" stroke="#ffffff1f"/>
  <circle cx="190" cy="475" r="26" fill="#ffffff16"/>

  <text x="70" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Noto Sans JP',sans-serif" font-size="80" fill="#ffffff" font-weight="900">スパイキッズ</text>
  <text x="70" y="365" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Noto Sans JP',sans-serif" font-size="30" fill="#ffffffb3">Movie • placeholder image</text>
  <text x="70" y="435" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Noto Sans JP',sans-serif" font-size="22" fill="#ffffff80">（著作権に配慮し、写真や公式素材ではなく自作の仮画像を使用）</text>
</svg>
